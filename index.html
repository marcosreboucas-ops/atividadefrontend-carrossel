<!DOCTYPE html>

    <title>Carrossel em HTML e CSS</title>

    <style>

        /* =========================
           PALETA DE CORES
        ========================== */

        ```css
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background-color: #F2E8D5;
    color: #171717;
}

header {
    background-color: #171717;
    color: #FFFFFF;
    text-align: center;
    padding: 30px 20px;
    border-bottom: 5px solid #D4A84F;
}

header h1 {
    margin-bottom: 10px;
}

main {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

main h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #8B1E2D;
}

.carrossel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    border: 5px solid #171717;
    border-radius: 15px;
}

.slide {
    width: 100%;
    min-width: 100%;
    flex-shrink: 0;
    scroll-snap-align: start;
    background-color: #FFFFFF;
}

.slide img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    display: block;
}

.slide figcaption {
    background-color: #8B1E2D;
    color: #FFFFFF;
    text-align: center;
    padding: 18px;
    font-size: 18px;
    border-top: 3px solid #D4A84F;
}

footer {
    background-color: #171717;
    color: #FFFFFF;
    text-align: center;
    padding: 25px;
    margin-top: 40px;
    border-top: 5px solid #D4A84F;
}
```


        /* =========================
           RESPONSIVIDADE
        ========================== */

        @media (max-width: 700px) {

            .slide img {
                height: 300px;
            }

            .slide figcaption {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>
